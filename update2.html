<!DOCTYPE html>
<html>
<head>

  <title>Diesel Logger</title>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    body {
      font-family: Arial;
      background: #111;
      color: white;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input,
    button {

      width: 100%;
      box-sizing: border-box;

      padding: 16px;
      margin-bottom: 14px;

      font-size: 18px;

      border: none;
      border-radius: 12px;
    }

    input {
      background: #222;
      color: white;
    }

    button {
      background: #5865F2;
      color: white;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #aaa;
    }

  </style>
</head>

<body>

<h1>Diesel Logger</h1>

<label>Person</label>
<input
  id="person"
  placeholder="Enter person's name"
>

<label>Vehicle</label>
<input
  id="vehicle"
  placeholder="Enter vehicle name"
>

<label>Litres</label>
<input
  id="litres"
  type="number"
  placeholder="Enter litres"
>

<label>Date</label>
<input
  id="date"
  type="date"
>

<button onclick="sendLog()">
  Submit Log
</button>

<script>

document.getElementById("date").value =
  new Date().toISOString().split('T')[0];

async function sendLog() {

  const webhookURL =
    "https://discord.com/api/webhooks/1505518561357987910/_3csgdyj1KiL2Luwqa59359XUpkNIbL1ug4o1rN9Ao4d0LAro0SnvKI1BOtNHN_b2edF";

  const person =
    document.getElementById("person").value;

  const vehicle =
    document.getElementById("vehicle").value;

  const litres =
    document.getElementById("litres").value;

  const rawDate =
    document.getElementById("date").value;

  if (!person || !vehicle || !litres || !rawDate) {

    alert("Please complete all fields");

    return;
  }

  const parts = rawDate.split("-");

  const formattedDate =
    `${parts[2]}/${parts[1]}/${parts[0]}`;

  const message = {

    content:
`Person: ${person}
Vehicle: ${vehicle}
Litres: ${litres}L
Date: ${formattedDate}`
  };

  try {

    await fetch(webhookURL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(message)
    });

    alert("Diesel log submitted!");

    document.getElementById("person").value = "";
    document.getElementById("vehicle").value = "";
    document.getElementById("litres").value = "";

  } catch (error) {

    alert("Error sending log");
  }
}

</script>

</body>
</html>
